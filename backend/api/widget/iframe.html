<!doctype html>
<html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web AI Widget</title>
    <style>
      :root {
        --widget-color: #1976d2;
        --widget-text-color: #ffffff;
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
        overflow-x: hidden;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      .wrap {
        height: 100%;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        max-width: 100%;
      }

      .header {
        padding: 12px 16px;
        background: var(--widget-color);
        color: var(--widget-text-color);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        flex-shrink: 0;
      }

      .header-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }

      .header-icon-default {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .header-icon-default svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
      }

      .chat {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        overflow-x: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        min-height: 0;
        max-width: 100%;
      }

      #messages {
        max-width: 100%;
        min-width: 0;
      }

      .welcome-block {
        margin-bottom: 12px;
      }

      .message-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 12px;
        max-width: 100%;
        width: 100%;
        min-width: 0;
      }

      .message-row.user-row {
        justify-content: flex-end;
      }

      .message-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex-shrink: 0;
      }

      .message-avatar-default {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--widget-color);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .message-avatar-default svg {
        width: 14px;
        height: 14px;
        stroke: white;
      }

      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }

      .suggestions button {
        padding: 8px 12px;
        border-radius: 20px;
        border: 1px solid #e2e8f0;
        background: #fff;
        font-size: 12px;
        color: #334155;
        cursor: pointer;
        font-weight: normal;
      }

      .typing-bubble {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 12px 16px;
      }

      .typing-bubble span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #64748b;
        animation: typing-dot 1.4s ease-in-out infinite both;
      }

      .typing-bubble span:nth-child(1) { animation-delay: 0s; }
      .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
      .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes typing-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
        40% { transform: scale(1); opacity: 1; }
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        flex-shrink: 0;
      }

      .input-wrap {
        flex: 1;
        display: flex;
        gap: 8px;
        align-items: center;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 8px 12px;
      }

      input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 14px;
        outline: none;
        color: #334155;
      }

      .send-btn {
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--widget-color);
        color: var(--widget-text-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .send-btn svg {
        width: 18px;
        height: 18px;
      }

      .send-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .bubble {
        max-width: 100%;
        padding: 10px 14px;
        border-radius: 12px;
        line-height: 1.5;
        font-size: 14px;
        white-space: pre-wrap;
        min-width: 0;
        box-sizing: border-box;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .message-row:not(.user-row) .bubble {
        max-width: calc(100% - 38px);
      }

      .meta,
      .meta a {
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .bubble.bot {
        border-radius: 12px 12px 12px 4px;
        background: #f1f5f9;
        color: #334155;
        margin-right: auto;
      }

      .bubble.user {
        border-radius: 12px 12px 4px 12px;
        margin-left: auto;
        background: var(--widget-color);
        color: var(--widget-text-color);
      }

      .meta {
        font-size: 12px;
        color: #666;
        margin-top: 6px;
      }

      a {
        color: var(--widget-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .footer-msg {
        font-size: 11px;
        color: #94a3b8;
        padding: 6px 16px;
        text-align: center;
        background: #ffffff;
      }

      [data-theme="dark"] .chat { background: #1e293b; }
      [data-theme="dark"] .wrap { background: #1e293b; }
      [data-theme="dark"] .row { background: transparent; }
      [data-theme="dark"] .input-wrap { background: #0f172a; border-color: #334155; }
      [data-theme="dark"] input { background: transparent; color: #e2e8f0; }
      [data-theme="dark"] .bubble.bot { background: #334155; color: #e2e8f0; }
      [data-theme="dark"] .suggestions button { background: #1e293b; border-color: #475569; color: #e2e8f0; }
      [data-theme="dark"] .footer-msg { background: #1e293b; color: #94a3b8; }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="header">
        <div class="header-left">
          <span id="headerIcon"></span>
          <span id="headerTitle">Chat</span>
          <span class="header-status-dot" id="headerStatusDot" title="Live"></span>
        </div>
      </div>
      <div id="chat" class="chat">
        <div id="welcome" class="welcome-block"></div>
        <div id="messages"></div>
      </div>
      <div class="row">
        <div class="input-wrap">
          <input id="msg" placeholder="Ask a question..." />
          <button id="send" class="send-btn" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </div>
      <div id="footer" class="footer-msg"></div>
    </div>
    <script src="./iframe.js"></script>
  </body>

</html>
