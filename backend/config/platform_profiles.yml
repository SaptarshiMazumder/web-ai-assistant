# Platform profiles for restaurant booking and other business types.
# All behavior (prompts, rules, suggested messages, menu tabs, etc.) is defined here.
# Edit this file to add or change platforms - no code changes needed.
#
# Schema:
#   reservation_platform_config: maps platform_id -> widget_key, domain_key, url_placeholder (optional)
#   post_crawl_jobs: jobs to run automatically after crawl completes (topic_extraction, booking_link, menu_extraction)
#   default_suggested_messages: fallback when no platform defines suggested_messages
#   platforms: per-domain config (crawl, menu extraction, prompts, etc.)

# Jobs run automatically after crawl completes. Controlled per-platform.
# - topic_extraction: extract topics from docs
# - booking_link: discover reservation/booking URLs from RAG (for generic bots; Tabelog/HotPepper use explicit URL)
# - menu_extraction: extract menu items from crawled pages (for Tabelog, HotPepper)
default_post_crawl_jobs:
  - booking_link

job_pipeline:
  defaults:
    on_failure: continue
    task_queue: celery
    run_messages:
      queued:
        en: "Automation pipeline queued"
        ja: "自動化パイプラインをキューに登録しました"
      running:
        en: "Automation pipeline running"
        ja: "自動化パイプラインを実行中です"
      paused:
        en: "Pipeline paused, waiting for manual action"
        ja: "パイプラインは一時停止中です（手動操作待ち）"
      resume_requested:
        en: "Resume requested, pipeline re-queued"
        ja: "再開要求を受け付け、パイプラインを再キューしました"
      done:
        en: "Automation pipeline completed"
        ja: "自動化パイプラインが完了しました"
      error:
        en: "Automation pipeline failed"
        ja: "自動化パイプラインが失敗しました"
  jobs:
    discovery:
      runner_ref: application.services.job_pipeline.runners.discovery:DiscoveryRunner
      retries: 0
      timeout_sec: 1200
      on_failure: continue
      progress_weight: 15
      running_progress_pct: 40
      progress_messages:
        queued:
          en: "Discovery queued"
          ja: "URL検出をキューに登録しました"
        running:
          en: "Discovering URLs"
          ja: "URLを検出しています"
        paused:
          en: "Waiting for URL selection"
          ja: "URL選択待ちです"
        done:
          en: "Discovery completed"
          ja: "URL検出が完了しました"
        error:
          en: "Discovery failed"
          ja: "URL検出に失敗しました"
      dashboard_label:
        en: "URL discovery"
        ja: "URL検出"
    crawl_import:
      runner_ref: application.services.job_pipeline.runners.crawl_import:CrawlImportRunner
      retries: 0
      timeout_sec: 1800
      on_failure: stop
      progress_weight: 35
      running_progress_pct: 45
      progress_messages:
        queued:
          en: "Crawl/import queued"
          ja: "クロールと取り込みをキューに登録しました"
        running:
          en: "Scanning and importing pages"
          ja: "ページをスキャンして取り込み中です"
        paused:
          en: "Crawl/import paused"
          ja: "クロールと取り込みは一時停止中です"
        done:
          en: "Crawl/import completed"
          ja: "クロールと取り込みが完了しました"
        error:
          en: "Crawl/import failed"
          ja: "クロールと取り込みに失敗しました"
      dashboard_label:
        en: "Crawl and import"
        ja: "クロールと取り込み"
    prompt_generation:
      runner_ref: application.services.job_pipeline.runners.prompt_generation:PromptGenerationRunner
      retries: 0
      timeout_sec: 300
      on_failure: continue
      progress_weight: 25
      running_progress_pct: 55
      progress_messages:
        queued:
          en: "Prompt generation queued"
          ja: "プロンプト生成をキューに登録しました"
        running:
          en: "Preparing bot prompt"
          ja: "ボットのプロンプトを準備中です"
        paused:
          en: "Prompt generation paused"
          ja: "プロンプト生成は一時停止中です"
        done:
          en: "Prompt generation completed"
          ja: "プロンプト生成が完了しました"
        error:
          en: "Prompt generation failed"
          ja: "プロンプト生成に失敗しました"
      dashboard_label:
        en: "Prompt generation"
        ja: "プロンプト生成"
    booking_link:
      runner_ref: application.services.job_pipeline.runners.booking_link:BookingLinkRunner
      retries: 0
      timeout_sec: 120
      on_failure: continue
      completion:
        enabled: true
        checker_ref: application.services.job_pipeline.completion:BookingLinkCompletionChecker
        poll_interval_sec: 4
        max_wait_sec: 1800
        status_map:
          running: [queued, running]
          done: [done]
          error: [failed, error, cancelled]
      progress_weight: 35
      running_progress_pct: 60
      progress_messages:
        queued:
          en: "Booking link extraction queued"
          ja: "予約リンク抽出をキューに登録しました"
        running:
          en: "Extracting booking links"
          ja: "予約リンクを抽出しています"
        paused:
          en: "Booking link extraction paused"
          ja: "予約リンク抽出は一時停止中です"
        done:
          en: "Booking link extraction completed"
          ja: "予約リンク抽出が完了しました"
        error:
          en: "Booking link extraction failed"
          ja: "予約リンク抽出に失敗しました"
      dashboard_label:
        en: "Booking link extraction"
        ja: "予約リンク抽出"
    menu_extraction:
      runner_ref: application.services.job_pipeline.runners.menu_extraction:MenuExtractionRunner
      retries: 0
      timeout_sec: 120
      on_failure: continue
      completion:
        enabled: true
        checker_ref: application.services.job_pipeline.completion:MenuExtractionCompletionChecker
        poll_interval_sec: 4
        max_wait_sec: 2400
        status_map:
          running: [queued, running]
          done: [done]
          error: [failed, error, cancelled]
      progress_weight: 45
      running_progress_pct: 70
      progress_messages:
        queued:
          en: "Menu extraction queued"
          ja: "メニュー抽出をキューに登録しました"
        running:
          en: "Preparing menu from crawled pages"
          ja: "クロール結果からメニューを作成中です"
        paused:
          en: "Menu extraction paused"
          ja: "メニュー抽出は一時停止中です"
        done:
          en: "Menu extraction completed"
          ja: "メニュー抽出が完了しました"
        error:
          en: "Menu extraction failed"
          ja: "メニュー抽出に失敗しました"
      dashboard_label:
        en: "Menu extraction"
        ja: "メニュー抽出"
    reservation_url:
      runner_ref: application.services.job_pipeline.runners.reservation_url:ReservationUrlRunner
      retries: 0
      timeout_sec: 60
      on_failure: continue
      progress_weight: 15
      running_progress_pct: 75
      progress_messages:
        queued:
          en: "Reservation URL automation queued"
          ja: "予約URL自動設定をキューに登録しました"
        running:
          en: "Confirming reservation URL"
          ja: "予約URLを確認しています"
        paused:
          en: "Reservation URL automation paused"
          ja: "予約URL自動設定は一時停止中です"
        done:
          en: "Reservation URL automation completed"
          ja: "予約URL自動設定が完了しました"
        error:
          en: "Reservation URL automation failed"
          ja: "予約URL自動設定に失敗しました"
      dashboard_label:
        en: "Reservation URL automation"
        ja: "予約URL自動設定"
  workflows:
    default:
      - prompt_generation
      - booking_link
    platform_overrides:
      tabelog:
        - prompt_generation
        - menu_extraction
        - reservation_url
      hotpepper:
        - prompt_generation
        - menu_extraction
        - reservation_url
      tablecheck:
        - prompt_generation
        - booking_link
  gates:
    discovery_manual_selection:
      step_id: discovery
      pause_on_step: true
      resume_event: urls_selected

reservation_url_rules:
  tabelog:
    assignment_mode: base_url
    base_url_source_key: root_url
    base_path_pattern: "^/[^/]+/[^/]+/[^/]+/\\d+/?"
    allowed_domains:
      - tabelog.com
    include_path_patterns:
      - "^/[a-z0-9\\-_/]+/?$"
    exclude_path_patterns:
      - "/map"
      - "/dtlmap"
      - "/review"
    path_keyword_scores:
      reserve: 8
      booking: 6
      yoyaku: 6
  hotpepper:
    assignment_mode: base_url
    base_url_source_key: root_url
    base_path_pattern: "^/(?:[a-z]{2}/)?strJ\\d+/?"
    allowed_domains:
      - hotpepper.jp
    include_path_patterns:
      - "^/(?:[a-z]{2}/)?strJ\\d+/?$"
    exclude_path_patterns:
      - "/map"
      - "/coupon"
      - "/photo"
    path_keyword_scores:
      strj: 8
      reserve: 6
      yoyaku: 6

defaults:
  jobs:
    topic_extraction_enabled: false
  rag_import:
    batch_size: 25
    max_embedding_requests_per_min: 1000
    busy_retry_max_attempts: 60
    busy_retry_initial_backoff_sec: 2
    busy_retry_max_backoff_sec: 30
  logging:
    crawl:
      emit_events:
        stage: true
        progress: false
        fetch: false
        result: true
        auth: false
        gcs_prefix: false
        error: true
      previews:
        single_page_content: false
        crawl_raw: false
        crawl_upload: false
  source_language: ja
  knowledge_tabs: [image]
  menu:
    category_aliases:
      party: course
      plan: course
      set: course
      beverage: drink
      food: dish
      lunch_set: lunch
    view_all_url_tokens:
      course: ["/party", "/course", "/course_cnod"]
      dish: ["/dtlmenu", "/food"]
      drink: ["/dtlmenu/drink", "/drink"]
      lunch: ["/dtlmenu/lunch", "/lunch"]
      menu: []
  functions:
    suggested_type_to_function:
      show_menu: show_menu
      escalate: escalate
      ai_response: ai_response
  assets:
    base_stopwords:
      - a
      - an
      - and
      - are
      - be
      - can
      - for
      - from
      - i
      - in
      - is
      - it
      - me
      - my
      - of
      - on
      - or
      - please
      - the
      - to
      - we
      - with
      - you
      - your
  prompts:
    deterministic:
      default_business_name:
        en: "this business"
        ja: "このビジネス"
      personality_with_business_type:
        en: "You are {bot_name}, a premier {business_type} assistant."
        ja: "あなたは{bot_name}、一流の{business_type}アシスタントです。"
      personality_without_business_type:
        en: "You are {bot_name}, an AI assistant."
        ja: "あなたは{bot_name}のAIアシスタントです。"
      section_titles:
        personality:
          en: "## Personality"
          ja: "## パーソナリティ"
        response_rules:
          en: "## Response Rules"
          ja: "## 応答ルール"
      response_rules:
        en:
          - "Respond in the same language as the user."
          - "Use trained content as the source of truth and answer clearly."
          - "If information is missing, say so directly and suggest how to confirm."
          - "When helpful, suggest a clear next step."
        ja:
          - "ユーザーの入力言語に合わせて回答してください。"
          - "学習済みコンテンツに基づいて、明確で正確に回答してください。"
          - "不明な点は推測せず、分からないと伝えたうえで確認方法を案内してください。"
          - "必要に応じて、次に取るべき行動を簡潔に提案してください。"
    generation:
      model: "gemini-2.0-flash-lite-001"
      identity_instruction_en: |
        IMPORTANT: The business name is "{business_name}". Use EXACTLY this name in the identity line.
      meta_prompt_en: |
        You are an expert prompt engineer. Your job is to write SYSTEM INSTRUCTIONS for an AI chatbot.

        IMPORTANT: You are writing INSTRUCTIONS that tell the AI how to behave — NOT a conversation with a user.

        RULES FOR THE OUTPUT:
        1. Write everything in the SAME LANGUAGE as the website content.
        2. Start with a "## Personality" section.
        3. Include a "## About the Business" section (max 2-3 lines, no volatile details).
        4. Do NOT include "Response Rules" or behavioral instructions.
        5. Do NOT write chatbot-style replies.
        6. Keep the entire output under 150 words.

        Website URL: {url}

        Website content (homepage only):
        {content}

        Generate ONLY the "## Personality" and "## About the Business" sections.
      meta_prompt_ja: |
        あなたは専門のプロンプトエンジニアです。AIチャットボットのシステム指示を書いてください。
        出力は指示文として自然に読める形式にしてください。

        ルール:
        1. すべて日本語で書く。
        2. 「## パーソナリティ」セクションを含める。
        3. 「## ビジネスについて」セクションを含める（2〜3行、変動情報を除く）。
        4. 「応答ルール」は含めない。
        5. チャット返信文のような書き方はしない。
        6. 150語以内。

        ビジネス名: {business_name}
        コンテンツ:
        {content}
      rag_meta_prompt_en: |
        You are an expert prompt engineer. Your job is to write SYSTEM INSTRUCTIONS for an AI chatbot.

        RULES FOR THE OUTPUT:
        1. Write in the same language as the provided business content.
        2. Include "## Personality".
        3. Include "## About the Business" in 2-3 lines without volatile details.
        4. Do NOT include response rules.
        5. Keep output under 150 words.

        Business Name: {business_name}

        Business content:
        {content}
      rag_meta_prompt_ja: |
        あなたは専門のプロンプトエンジニアです。AIチャットボットのシステム指示を書いてください。
        以下のビジネス情報を使って「## パーソナリティ」と「## ビジネスについて」を日本語で作成してください。
        応答ルールは書かず、150語以内で簡潔にまとめてください。

        ビジネス名: {business_name}
        ビジネスコンテンツ:
        {content}
      standard_response_rules_en: |

        ## Response Rules
        - MANDATORY: Detect the language of the user's input and respond in that same language.
        - Use bullet points when listing multiple items from the same category.
        - You may use markdown bold (**text**) to emphasize important items, sparingly.
        - Provide detailed, helpful explanations.
        - If you don't know something, say so and suggest checking the website.
        - End responses on a welcoming note, and ask a logical follow-up question when useful.
      standard_response_rules_ja: |

        ## 応答ルール
        - 必須：ユーザーの入力言語を検出し、同じ言語で応答してください。
        - 同じカテゴリの複数項目を列挙する場合は箇条書きを使ってください。
        - 強調にはマークダウン太字（**テキスト**）を控えめに使えます。
        - 詳細で役立つ説明を提供してください。
        - わからない場合は正直に伝え、Webサイト確認を提案してください。
        - 応答は歓迎的な言葉で締め、必要に応じて自然なフォローアップ質問をしてください。
    fallback:
      personality_title_en: "## Personality"
      about_title_en: "## About the Business"
      personality_title_ja: "## パーソナリティ"
      about_title_ja: "## ビジネスについて"
      personality_en: "You are {business_name}'s AI assistant, a helpful and friendly guide."
      about_en: "{business_name} is dedicated to providing excellent service to its customers."
      personality_ja: "あなたは{business_name}のAIアシスタントで、親切でフレンドリーなガイドです。"
      about_ja: "{business_name}はお客様に卓越したサービスを提供することに専念しています。"

