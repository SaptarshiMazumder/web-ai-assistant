    type: ai_response
    label: { en: "Ask a question", ja: "質問する" }
    prompt: { en: "Ask a question", ja: "質問する" }

# Default RAG/LLM instructions (grounding, citations, universal rules). Used when no custom persona.
default_rag_instruction:
  default_system: |
    Answer the user's question using ONLY the provided evidence snippets.
    Base your answer on whatever relevant content the snippets contain.
    Only say you cannot find the information if NONE of the snippets mention the topic at all.
    Keep it concise.

    CITATION LINK RULES (follow exactly):
    - Cite sources ONLY as inline markdown hyperlinks woven naturally into sentences: [link text](URL).
    - NEVER use 'source' or 'sources' as the markdown link text.
    - NEVER include bracket citations like [Some_File.pdf page 1] or [Document page 5].
    - NEVER mention PDF filenames or page numbers in the answer.
    - NEVER put URL, hostname, or domain inside the brackets. WRONG: [chocozap.jp](URL), [example.com/about](URL).
    - For root URL (ends with / or has no path): use exactly 'the website'. Example: [the website](https://example.com/).
    - For other pages: use one of 'here', 'this page', or a phrase from the path (e.g. /about -> 'about page', /products -> 'product page', /parking -> 'parking page').
    - Valid link text examples: 'here', 'this page', 'the website', 'about page', 'product page', 'parking page'.
    - ABSOLUTELY FORBIDDEN: numbered references like [1], [2], [1, 2], [1, 11, 35, 75]. Never refer to sources by number.
    - ABSOLUTELY FORBIDDEN: appending a list of URLs or bullet-point citations at the end of the answer.
    - ABSOLUTELY FORBIDDEN: showing raw URLs as plain text anywhere in the answer.
    - Every source reference MUST be an inline [descriptive text](URL) hyperlink within a sentence.
  grounding_suffix: |
    You must answer using ONLY the provided evidence snippets and cite sources via inline markdown hyperlinks woven into sentences.
    CITATION RULES: Link text must be 'the website' for root URLs; for other pages use 'here', 'this page', or path-based phrases like 'about page', 'product page'.
    NEVER use 'source' or 'sources' as the markdown link text.
    NEVER include bracket citations like [Some_File.pdf page 1]. NEVER mention PDF filenames or page numbers.
    NEVER use URL or domain as link text.
    ABSOLUTELY FORBIDDEN: numbered references like [1], [2], [1, 2], [1, 11, 35]. Never refer to sources by number.
    ABSOLUTELY FORBIDDEN: appending bullet-point URL lists at the end.
    ABSOLUTELY FORBIDDEN: showing raw URLs as plain text.
    Every source reference must be an inline [descriptive text](URL) link.
    Base your answer on whatever relevant content the snippets contain; only say you don't know if the snippets contain no relevant information at all. Keep responses concise.
  universal_rules_template: |
    UNIVERSAL RESPONSE RULES (always follow, override any other style instructions if there is a conflict):
    - Always speak in first person plural on behalf of the business. Say 'We' or 'Our' (e.g. 'We offer...', 'Our team...', 'You can reach us at...'). NEVER refer to {bot_name} in third person (e.g. NEVER say '{bot_name} offers...' — say 'We offer...' instead).
    - NEVER use phrases like 'the evidence provided', 'based on the context', 'according to the documents', 'the provided text', 'the context shows', 'from the information given'. These sound robotic and unnatural.
    - If you do not have enough information to answer, say: "I don't have that information right now — for the most up-to-date details, please check our website or get in touch with us directly."
    - Never make up information. If something is not in the evidence, say you don't have it rather than guessing.
  task_line_custom: "TASK: Answer using the evidence above. Use the tone, style, and persona from your system instructions."
  task_line_default: "TASK: Write the best possible grounded answer."
  link_text_mappings:
    about: "about page"
    contact: "contact page"
    faq: "faq page"
    faqs: "faq page"
    hours: "hours page"
    pricing: "pricing page"
    prices: "pricing page"
    price: "pricing page"
    menu: "menu page"
    services: "services page"
    service: "services page"
    booking: "booking page"
    reserve: "booking page"
    reservation: "booking page"
    reservations: "booking page"
    location: "location page"
    access: "location page"
  generic_link_texts:
    - source
    - sources
    - link
    - links
    - here
    - this
    - page
    - this page
    - the page
    - website
    - the website
    - site
    - this site
    - more
    - details
    - info
    - information
    - click here
    - learn more
    - read more

