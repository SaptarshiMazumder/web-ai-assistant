            - 全メニュー
            - メニュー全部
            - 一覧
      asset_instructions:
        en: |
          ASSET USAGE RULES (menu items). When show_assets is true, use {{asset_ID}} only for items that directly match their question. Be precise: e.g. 'butter chicken curry' means cite only the butter chicken curry item, not chicken curry.
        ja: |
          アセット使用ルール（メニュー項目）。show_assetsがtrueの場合、質問に直接一致する項目のみ{{asset_ID}}を使用してください。正確に: 例「バターチキンカレー」はバターチキンカレーの項目のみを引用してください。
      json_response_format:
        enabled: true
        schema:
          answer: "Plain text answer for the customer (markdown links allowed)"
          intent: "reservation | menu | other"
          show_assets: "boolean"
        show_assets_true_when:
          en: |
            Set show_assets to TRUE when the question is about menu, dishes, food, drinks, courses, lunch, dinner, desserts, products, services, recommendations, or specific items (e.g. "what's the omakase?", "show me the wine list"). Also set to TRUE whenever you have included {{asset_ID}} markers in your answer.
          ja: |
            show_assetsをTRUEにする場合: メニュー、料理、食べ物、飲み物、コース、ランチ、ディナー、デザート、商品、サービス、おすすめ、または特定の品目（例：「おまかせは？」「ワインリストを見せて」）についての質問。回答に{{asset_ID}}マーカーを含めた場合もTRUEにしてください。
        show_assets_false_when:
          en: |
            Set show_assets to FALSE when the question is about reservations, booking, tables, hours, location, contact, or general info. Keep the answer focused on reservation/location/contact only.
          ja: |
            show_assetsをFALSEにする場合: 予約、席、営業時間、場所、連絡先、または一般的な情報についての質問。回答は予約・場所・連絡先にのみ焦点を当ててください。
        intent_when:
          en: |
            reservation: when the question is about booking, tables, hours, location, contact, or how to reserve.
            menu: when the question is about dishes, food, drinks, courses, lunch, dinner, desserts, or specific items.
            other: for any other question.
          ja: |
            reservation: 予約、席、営業時間、場所、連絡先、予約方法についての質問。
            menu: 料理、食べ物、飲み物、コース、ランチ、ディナー、デザート、特定の品目についての質問。
            other: その他の質問。

