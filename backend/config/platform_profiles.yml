# Platform profiles for restaurant booking and other business types.
# All behavior (prompts, rules, suggested messages, menu tabs, etc.) is defined here.
# Edit this file to add or change platforms - no code changes needed.
#
# Schema:
#   reservation_platform_config: maps platform_id -> widget_key, domain_key, url_placeholder (optional)
#   default_suggested_messages: fallback when no platform defines suggested_messages
#   platforms: per-domain config (crawl, menu extraction, prompts, etc.)

reservation_platform_config:
  tabelog:
    widget_key: tabelogUrl
    domain_key: tabelog.com
    url_placeholder: "https://tabelog.com/tokyo/A1304/A130401/13224546/"
  hotpepper:
    widget_key: hotPepperUrl
    domain_key: hotpepper.jp
    url_placeholder: "https://www.hotpepper.jp/strJ001234567/"
  tablecheck:
    widget_key: tableCheckUrl
    domain_key: tablecheck.com
    url_placeholder: "https://www.tablecheck.com/en/shops/your-restaurant/reserve"

# Default asset rules (used when no platform or platform doesn't override)
default_asset_rules:
  marker_rule: "Include {{asset_ASSET_ID}} for EVERY product/service you mention by name. One marker per item — do not skip any. URLs and images are resolved server-side from the ID."
  evidence_template: "To show this product's image in the response, include {{asset_{asset_id}}} in your answer."

# Default asset term config (used when no platform overrides)
# Empty = no filters, let the LLM decide when to show assets.
default_asset_term_config:
  generic_tokens: []
  asset_intent_terms: []
  visual_request_terms: []
  visual_request_many_terms: []
  visual_suppress_terms: []

default_suggested_messages:
  - id: suggest_1
    type: ai_response
    label: { en: "Ask a question", ja: "質問する" }
    prompt: { en: "Ask a question", ja: "質問する" }

platforms:
  tabelog.com:
    domain_pattern: "tabelog\\.com"
    include_paths: []
    exclude_paths:
      - "/peripheral_map(?:/|$)"
      - "/dtlphotolst(?:/|$)"
      - "/dtlrvwlst(?:/|$)"
      - "/dtlmap(?:/|$)"
    priority: 10
    strip_query_params: true
    menu_url_patterns:
      - "/party(?:/|$)"
      - "/dtlmenu(?:/|$)"
    menu_extraction_rules:
      enabled: true
      mode: deterministic
      extractor: tabelog_v1
      allowed_path_patterns:
        - "^/(?:[a-z]{2}(?:-[a-z]{2})?/)?[A-Za-z0-9._-]+/A\\d+/A\\d+/\\d+/?$"
        - "^/(?:[a-z]{2}(?:-[a-z]{2})?/)?[A-Za-z0-9._-]+/A\\d+/A\\d+/\\d+/(?:party|dtlmenu)(?:/|$)"
      path_category_patterns:
        - pattern: "/party(?:/|$)"
          category: course
        - pattern: "/dtlmenu/drink(?:/|$)"
          category: drink
        - pattern: "/dtlmenu/lunch(?:/|$)"
          category: lunch
        - pattern: "/dtlmenu(?:/|$)"
          category: dish
    metadata:
      platform_type: restaurant_reservation
      country: JP
      service_name: Tabelog
      reservation:
        enabled: true
        link_label:
          en: "Tabelog Online Reservation"
          ja: "食べログ ネット予約"
        instruction_template:
          en: "When the customer asks about reservations or booking, include this exact link: {url}. Answer naturally based on the evidence; use this URL whenever reservation is relevant."
          ja: "お客様が予約・ご予約についてお問い合わせの際は、このリンクを含めてください: {url}。証拠に基づいて自然に回答し、予約に関連する場合はこのURLを使用してください。"
      suggested_messages:
        - id: suggest_menu
          type: show_menu
          label: { en: "Menu", ja: "メニュー" }
        - id: suggest_reservation
          type: ai_response
          label: { en: "Reservation", ja: "予約" }
          prompt: { en: "Reservation", ja: "予約" }
        - id: suggest_support
          type: escalate
          label: { en: "Human support", ja: "サポートに相談" }
      asset_filter:
        reservation_suppress_terms:
          - reservation
          - reserve
          - reserving
          - book
          - booking
          - table
          - 予約
          - 席
        menu_food_intent_terms:
          - menu
          - dish
          - dishes
          - food
          - drink
          - drinks
          - course
          - メニュー
          - 料理
          - コース
          - ランチ
          - ディナー
          - デザート
      asset_rules:
        marker_rule: "Include {{asset_ASSET_ID}} for EVERY product/service you mention by name. One marker per item — do not skip any. URLs and images are resolved server-side from the ID."
        evidence_template: "To show this product's image in the response, include {{asset_{asset_id}}} in your answer."
        asset_term_config:
          generic_tokens:
            - about
            - available
            - booking
            - cost
            - detail
            - details
            - info
            - information
            - item
