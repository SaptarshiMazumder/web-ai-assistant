# Default JSON response format for ALL bots. Platforms (Tabelog, HotPepper) add extra keys like intent.
default_json_response_format:
  schema:
    answer: "Plain text answer for the customer (markdown links allowed)"
    show_assets: "boolean"
  show_assets_true_when:
    en: |
      Set show_assets to TRUE when the question is about products, services, menu, dishes, food, drinks, courses, or anything the business sells or provides.
    ja: |
      show_assetsをTRUEにする場合: 商品、サービス、メニュー、料理、食べ物、飲み物、コース、または事業が販売・提供するものについての質問。
  show_assets_false_when:
    en: |
      Set show_assets to FALSE when the question is about contact, hours, location, booking, or general info.
    ja: |
      show_assetsをFALSEにする場合: 連絡先、営業時間、場所、予約、または一般的な情報についての質問。

platforms:
  tabelog.com:
    domain_pattern: "tabelog\\.com"
    include_paths: []
    exclude_paths:
      - "/peripheral_map(?:/|$)"
      - "/dtlphotolst(?:/|$)"
      - "/dtlrvwlst(?:/|$)"
      - "/dtlmap(?:/|$)"
    priority: 10
    strip_query_params: true
    menu_url_patterns:
      - "/party(?:/|$)"
      - "/dtlmenu(?:/|$)"
    menu_extraction_rules:
      enabled: true
      mode: deterministic
      extractor: tabelog_v1
      allowed_path_patterns:
        - "^/(?:[a-z]{2}(?:-[a-z]{2})?/)?[A-Za-z0-9._-]+/A\\d+/A\\d+/\\d+/?$"
        - "^/(?:[a-z]{2}(?:-[a-z]{2})?/)?[A-Za-z0-9._-]+/A\\d+/A\\d+/\\d+/(?:party|dtlmenu)(?:/|$)"
      path_category_patterns:
        - pattern: "/party(?:/|$)"
          category: course
        - pattern: "/dtlmenu/drink(?:/|$)"
          category: drink
        - pattern: "/dtlmenu/lunch(?:/|$)"
          category: lunch
        - pattern: "/dtlmenu(?:/|$)"
          category: dish
    metadata:
      platform_type: restaurant_reservation
      country: JP
      service_name: Tabelog
      reservation:
        enabled: true
        link_label:
          en: "Tabelog Online Reservation"
          ja: "食べログ ネット予約"
        instruction_template:
          en: "When the customer asks about reservations or booking, include this exact link: {url}. Answer naturally based on the evidence; use this URL whenever reservation is relevant."
          ja: "お客様が予約・ご予約についてお問い合わせの際は、このリンクを含めてください: {url}。証拠に基づいて自然に回答し、予約に関連する場合はこのURLを使用してください。"
      suggested_messages:
        - id: suggest_menu
          type: show_menu
          label: { en: "Menu", ja: "メニュー" }
        - id: suggest_reservation
          type: ai_response
          label: { en: "Reservation", ja: "予約" }
          prompt: { en: "Reservation", ja: "予約" }
        - id: suggest_support
          type: escalate
          label: { en: "Human support", ja: "サポートに相談" }
      asset_rules:
        marker_rule: "Include {{asset_ASSET_ID}} for EVERY product/service you mention by name. One marker per item — do not skip any. URLs and images are resolved server-side from the ID."
        evidence_template: "To show this product's image in the response, include {{asset_{asset_id}}} in your answer."
        asset_term_config:
          generic_tokens:
            - about
            - available
            - booking
            - cost
            - detail
            - details
            - info
            - information
