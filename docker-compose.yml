services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "${VITE_API_BASE:-}"
        VITE_DASHBOARD_BASE: "/dashboard/"
        VITE_AUTH0_DOMAIN: "${VITE_AUTH0_DOMAIN:-}"
        VITE_AUTH0_CLIENT_ID: "${VITE_AUTH0_CLIENT_ID:-}"
        VITE_AUTH0_AUDIENCE: "${VITE_AUTH0_AUDIENCE:-}"
        VITE_AUTH_ORG_CLAIM: "${VITE_AUTH_ORG_CLAIM:-}"
        VITE_SUPER_ADMIN_EMAILS: "${VITE_SUPER_ADMIN_EMAILS:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "5000"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/creds.json"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      PYTHONPATH: "/app/backend"
    volumes:
      - ${HOST_GCP_CREDS:-./backend/creds/gen-lang-client-0545494042-b36c2aa59869.json}:/app/creds.json:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: "/app/creds.json"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      PYTHONPATH: "/app/backend"
    volumes:
      - ${HOST_GCP_CREDS:-./backend/creds/gen-lang-client-0545494042-b36c2aa59869.json}:/app/creds.json:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command:
      [
        "sh",
        "-lc",
        "xvfb-run -a -s \"-screen 0 1920x1080x24\" --error-file=/dev/stdout celery -A infrastructure.celery_app worker --loglevel=info --concurrency=10"
      ]
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: "http://localhost:5000"
        VITE_DASHBOARD_BASE: "/"
        VITE_AUTH0_DOMAIN: "${VITE_AUTH0_DOMAIN:-}"
        VITE_AUTH0_CLIENT_ID: "${VITE_AUTH0_CLIENT_ID:-}"
        VITE_AUTH0_AUDIENCE: "${VITE_AUTH0_AUDIENCE:-}"
        VITE_AUTH_ORG_CLAIM: "${VITE_AUTH_ORG_CLAIM:-}"
        VITE_SUPER_ADMIN_EMAILS: "${VITE_SUPER_ADMIN_EMAILS:-}"
    ports:
      - "5173:80"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webai
      POSTGRES_USER: webai
      POSTGRES_PASSWORD: Madrid2018
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webai -d webai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
